<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온라인 회전 오목</title>
<style>
body{text-align:center;font-family:Arial;margin:10px;}
#board{display:grid;grid-template-columns:repeat(6,1fr);width:95vw;max-width:420px;aspect-ratio:1/1;margin:20px auto;}
.cell{background:#f5d6a0;border:1px solid black;display:flex;align-items:center;justify-content:center;position:relative;touch-action:manipulation;}
.bold-right{border-right:4px solid black;}
.bold-bottom{border-bottom:4px solid black;}
.black,.white{width:80%;height:80%;border-radius:50%;}
.black{background:black;}
.white{background:white;border:1px solid black;}
button{padding:8px;margin:5px;font-size:16px;}
</style>
</head>
<body>

<h2 id="turn">BLACK TURN</h2>
<div id="board"></div>
<h2 id="msg"></h2>
<button onclick="resetGame()">다시 시작</button>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
